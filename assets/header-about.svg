<svg xmlns="http://www.w3.org/2000/svg" width="850" height="70" viewBox="0 0 850 70">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101923" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#17232D" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#17232D"/>
      <stop offset="0.85" stop-color="#17232D" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#101923" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barL" x1="100" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76E4CE" stop-opacity="0"/>
      <stop offset="1" stop-color="#76E4CE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="barR" x1="480" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76E4CE" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#76E4CE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background panel -->
  <rect x="50" y="10" width="750" height="50" rx="6" fill="url(#panelBg)"/>
  <!-- Left accent bar -->
  <rect x="100" y="37" width="270" height="1.5" rx="0.75" fill="url(#barL)"/>
  <!-- Section title -->
  <text x="425" y="43" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#76E4CE" letter-spacing="6">👋  ABOUT ME</text>
  <!-- Right accent bar -->
  <rect x="480" y="37" width="270" height="1.5" rx="0.75" fill="url(#barR)"/>
  <!-- Side diamonds -->
  <polygon points="85,35 90,38 85,41 80,38" fill="#67DDF5" opacity="0.4"/>
  <polygon points="765,35 770,38 765,41 760,38" fill="#67DDF5" opacity="0.4"/>
</svg>
